name: Dashboard Yayınla
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Site klasörü hazırla
        run: |
          mkdir -p site
          [ -f robots.txt ] && cp robots.txt site/robots.txt
          if [ -f index.html ]; then cp index.html site/index.html;
          elif [ -f dashboard.html ]; then cp dashboard.html site/index.html;
          else echo "index.html yok"; exit 1; fi
          # uygulama olarak yükleme dosyaları (simge, manifest, servis çalışanı)
          [ -f manifest.webmanifest ] && cp manifest.webmanifest site/ || true
          [ -f sw.js ] && cp sw.js site/ || true
          [ -d uygulama ] && cp -r uygulama site/ || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      # GitHub bazen yüklenen paketi birkaç saniye geç görüyor ("No artifacts named github-pages").
      # Bu yüzden yayın önce kısa bir beklemeden sonra deneniyor; olmazsa 30 sn sonra bir kez daha.
      - name: Paketin görünmesini bekle
        run: sleep 10
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Yayın tekrar denemesi için bekle
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
